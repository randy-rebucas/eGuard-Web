services:
  db:
    image: postgres:16-alpine
    container_name: eguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eguard
      POSTGRES_PASSWORD: eguard_dev_password
      POSTGRES_DB: eguard
    # 5432 is owned by the native Windows Postgres service on this machine. Keep the host port below 49152:
    # Windows reserves ranges above it for Hyper-V/WSL, which blocked the old 55433
    ports:
      - "15433:5432"
    volumes:
      - eguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eguard -d eguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev SMTP server: catches every email eGuard sends. Inbox at http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: eguard-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  eguard-db:
